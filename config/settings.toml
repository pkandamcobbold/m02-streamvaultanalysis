# StreamVault back-catalog analysis — every tunable parameter.
#
# Adjoa: change values here, not in the code. Nothing in src/ hard-codes a
# threshold, a path or a window boundary; it all comes from this file.
#
# TOML, read with Python's built-in tomllib — no library to install, nothing
# to build, and it will still load on whatever Python you have next year.
#
# Values marked TO SET AFTER PROFILING are placeholders. They get set once the
# stage-5 profile shows what the data actually looks like, and each one gets a
# sensitivity row in decisions/ showing what the recommendation
# looks like if it were set differently. Do not treat them as principled until
# that has been done.

[input]
id_list_path = "data/input/id_list.csv"
expected_id_count = 127     # the brief's number. A mismatch is reported as a
                            # finding, not a crash. Next year: 500.

[paths]
raw_dir = "data/raw"
interim_dir = "data/interim"
processed_dir = "data/processed"
reports_dir = "reports"

[api]
base_url = "https://api.themoviedb.org/3"
timeout_seconds = 10            # ceiling on every single call
max_retries = 5
backoff_factor = 0.5            # waits 0.5s, 1s, 2s, 4s, 8s
min_seconds_between_calls = 0.08  # ~12 req/s, comfortably inside TMDb's limits
append_credits = true           # ADR-001: one call per film instead of two.
                                # Set false to run the briefed two-call path
                                # and compare the timings.
progress_every = 25             # print a progress line every N films

# Both windows are computed by the same code path, called twice.
# all_years has no min_year key at all: TOML has no null, and an absent key
# is read as "no lower bound". Do not set it to 0 — that would be a real
# boundary that silently excludes films with an unparseable release date.
[windows.all_years]
label = "All years"

[windows.modern]
label = "2000 onward"
min_year = 2000                 # Yaw's window

[performance]
treat_zero_money_as_missing = true  # zero budget/revenue as a disguised null.
                                    # Set false to compute every money metric
                                    # the other way (zeros as real flops).
# SET AFTER PROFILING (stage 5, 2026-11-19). Both values below are now
# justified against the actual distribution rather than assumed — see M9.
min_budget_for_roi = 1000000        # a guard, inactive this quarter: the
                                    # smallest budget on the list is 1,200,000,
                                    # so no film is excluded. Kept because next
                                    # quarter's list may include a small film,
                                    # where ROI on a tiny budget is unstable.
hit_roi_threshold = 2.5             # kept at the break-even rule of thumb, an
                                    # industry justification, NOT fitted to
                                    # this data. But note what it does here:
                                    # 92% of the list clears it, so hit rate
                                    # barely discriminates — a direct symptom
                                    # of the selection bias in F-06. Stage 7
                                    # therefore reports all three definitions
                                    # below, not just this one.
hit_definition = "roi"              # roi | above_median | top_quartile
report_all_hit_definitions = true   # because no single one is defensible alone
                                    # on a list with no failures in it:
                                    #   roi >= 2.5     -> 92% are hits
                                    #   above_median   -> 50% by construction
                                    #   top_quartile   -> ROI >= 8.85

[profile]
# Plausibility floors, not cleaning rules. A value below one of these is
# *flagged with a reason* and classified; nothing is ever deleted here. The
# floors are deliberately far below anything a real film would have, so that a
# flag means "look at this", not "this is unusual" — a profile that flags 30
# films flags nothing.
min_plausible_budget = 100000      # below this, suspect a figure entered in
                                   # millions (a budget of 5 meaning $5m)
min_plausible_revenue = 100000     # same reasoning, on the other side
min_votes_for_reliable_rating = 1000   # a high average on few votes is noise
min_feature_runtime = 70           # below this, suspect a short or a TV cut
max_plausible_runtime = 300        # above this, suspect a boxed set
extreme_roi = 20.0                 # not an error — a flag to check the era on
flop_roi = 1.0                     # revenue below budget: real, and the thing
                                   # CL1's "floor" argument is about

# TMDb's `popularity` is a rolling engagement score that changes daily and is
# heavily recency-biased (Endgame 85.7, a 1966 classic 0.5). It is kept in the
# tables as fetched, and excluded from every performance metric: using it would
# measure how much a film is being looked at this week, and would make the
# analysis unreproducible from the same cache a month later. See M8.
use_popularity_as_performance = false

[talent]
lead_actor_billing_order = 0    # order == 0 is "the lead"
sensitivity_top_n_billed = 3    # re-run the talent analysis on top-3 billed
min_films_for_reliable = 3      # below this, report but never recommend

[franchise]
min_members_on_list = 2         # a collection with one film on our list is not
                                # a bundle anyone can buy. Set to 1 to compute
                                # it the other way.

[shortlist]
n_franchises = 3
n_standalones = 5
show_runners_up = 3             # "why it made the cut" means something only
                                # next to what did not

[budget]
analysis_seconds_limit = 10     # the shaping, validate and transform stages, cache warm, acquisition excluded
projection_target_titles = 500

# The improvement beyond the brief: a release gate. The pipeline refuses to
# produce a client-facing memo or shortlist if any of these fails, with a
# message Adjoa can act on. She reruns this quarterly, sometimes live in the
# meeting; the failure this protects against is her presenting a confident
# number from a broken run with no way to know. See reports/improvement.md.
[gate]
enabled = true
max_unaccounted_rows = 0            # every source row must be accounted for
min_films_for_a_recommendation = 40 # below this the groups are too thin to
                                    # compare; say so instead of ranking
max_missing_money_share = 0.20      # above this, money metrics are not a basis
                                    # for a $14m decision
block_if_spotcheck_moves = true     # if a live re-check changes the answer,
                                    # the memo must not be published unread

[spotcheck]
films_per_slice = 3             # 4 slices x 3 = 12 live re-fetches
random_seed = 20251031          # seeded so the sample is reproducible
always_include_flagged = true   # force recovered ids and disguised nulls into
                                # the sample: a check that avoids the risky
                                # rows is not a check

# How much of the headline gap survives resampling (F-02). The comparison rests
# on 87 franchise films against 25 standalones, which is small enough that the
# difference needs an interval beside it rather than a point estimate.
[uncertainty]
bootstrap_samples = 10000        # 10k is stable to ~0.01 on these intervals;
                                 # 1k is visibly noisy, 100k buys nothing
cluster_bootstrap_samples = 2000 # the whole-franchise version keeps a loop,
                                 # because its draws differ in length
random_seed = 20251031           # seeded, so a reviewer re-running sees the same
                                 # intervals and can tell a real change from a draw
